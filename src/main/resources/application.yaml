spring:
  config:
    import: "optional:file:.env[.properties],optional:file:../.env[.properties]"
  application:
    name: SysMind MCP
  ai:
    mcp:
      server:
        name: sysmind-mcp
        version: 1.0.0
        protocol: STATELESS
        type: SYNC
        capabilities:
          tool: true
          resource: false
          prompt: false
          completion: false
        streamable-http:
          mcp-endpoint: /mcp

llm:
  url: "${LLM_URL}"
  timeout: "${LLM_TIMEOUT}"
  chat-completions-path: "${LLM_CHAT_COMPLETIONS_PATH}"

news:
  feed-url: "https://news.google.com/rss?hl={language}&gl={country}&ceid={ceid}"
  location-feed-url-template: "https://news.google.com/rss/search?q={query}&hl={language}&gl={country}&ceid={ceid}"
  language: "${NEWS_LANGUAGE:en-US}"
  country: "${NEWS_COUNTRY:US}"
  ceid: "${NEWS_CEID:}"

chroma:
  url: "${CHROMA_URL:http://localhost:8000}"
  timeout: "${CHROMA_TIMEOUT:5s}"
  tenant: "${CHROMA_TENANT:default_tenant}"
  database: "${CHROMA_DATABASE:default_database}"
  collection: "${CHROMA_COLLECTION:sysmind}"
