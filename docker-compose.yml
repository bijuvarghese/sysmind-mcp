services:
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - NEWS_LANGUAGE=${NEWS_LANGUAGE:-en-US}
      - NEWS_COUNTRY=${NEWS_COUNTRY:-US}
      - NEWS_CEID=${NEWS_CEID:-}
      - CHROMA_URL=${CHROMA_URL:-http://chroma:8000}
      - CHROMA_TIMEOUT=${CHROMA_TIMEOUT:-5s}
      - CHROMA_TENANT=${CHROMA_TENANT:-default_tenant}
      - CHROMA_DATABASE=${CHROMA_DATABASE:-default_database}
      - CHROMA_COLLECTION=${CHROMA_COLLECTION:-sysmind}
    depends_on:
      chroma:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health | grep -q 'UP'"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  chroma:
    image: ${CHROMA_IMAGE:-chromadb/chroma:1.5.0}
    ports:
      - "8000:8000"
    volumes:
      - chroma-data:/data
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v2/healthcheck', timeout=3).read()\""]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

volumes:
  chroma-data:
